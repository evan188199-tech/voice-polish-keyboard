name: TypingHostQA
options:
  deploymentTarget: {iOS: '18.0'}
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    GENERATE_INFOPLIST_FILE: YES
targets:
  TypingHostQA:
    type: application
    platform: iOS
    info:
      path: GeneratedInfo.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicepolish.qa.typing-host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets: [SystemKeyboardUI]
  SystemKeyboardUI:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TypingHostQA
    settings: {base: {PRODUCT_BUNDLE_IDENTIFIER: com.voicepolish.qa.typing-system-tests}}
